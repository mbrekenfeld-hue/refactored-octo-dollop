<!DOCTYPE html>
<html lang="en">
<head>
    <!-- MANDATORY: Tells Figmin XR to initialize the scripting API -->
    <meta name="figmin">
    
    <meta charset="UTF-8">
    <title>My First Figmin XR Script</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
            padding-top: 50px;
        }
        h1 { color: #00d2ff; }
    </style>
</head>
<body>

    <h1>Figmin XR Script Status:</h1>
    <p id="status">Waiting for Figmin XR to load...</p>

    <script>
        // Listen on the document object for Figmin to become ready
        document.addEventListener("FigminReady", () => {
            document.getElementById("status").innerText = "Connected to Figmin! Spawning object...";

            // Define position: [X (left/right), Y (up/down), Z (forward/backward)]
            const position = [0, 0, -1.2]; 
            const rotation = [0, 0, 0];
            const scale = [1, 1, 1];

            // Tell Figmin to spawn the built-in toy duck
            figmin.createObject('gltf_duck', position, rotation, scale, (error, objectId) => {
                if (error) {
                    document.getElementById("status").innerText = "Error: " + error;
                } else {
                    document.getElementById("status").innerText = "Successfully spawned Duck! ID: " + objectId;
                }
            });
        });
    </script>
</body>

</html>
