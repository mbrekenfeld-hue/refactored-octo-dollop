<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Tells Figmin XR to initialize the scripting tools -->
    <meta name="figmin">
    <meta charset="UTF-8">
    <title>My First Figmin XR Script</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
            padding-top: 50px;
        }
        h1 { color: #00d2ff; }
    </style>
</head>
<body>

    <h1>Figmin XR Script Status:</h1>
    <p id="status">Waiting for Figmin XR to load...</p>

    <script>
        // 1. Wait for Figmin XR to be ready
        document.addEventListener("FigminReady", init);

        function init() {
            document.getElementById("status").innerText = "Connected to Figmin! Spawning 3D text...";

            try {
                // 2. Use the official configuration format to spawn a 3D Text object
                const obj = figmin.createObject(figmin.ObjectType.TEXT3D, {
                    text: "Hello Quest 3!",
                    targetSize: 0.2
                });

                document.getElementById("status").innerText = "Successfully spawned 3D text!";
            } catch (error) {
                document.getElementById("status").innerText = "Failed to spawn: " + error.message;
            }
        }
    </script>
</body>
</html>
